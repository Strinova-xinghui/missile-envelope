# 接 GitHub 后的最小 CI。
#
# ⚠ 设计前提（务必读完再改）：**本公开仓库不含求解器内核**（`vendor/wt-missile/`）。
#   因此 GitHub 托管的 runner（ubuntu-latest / windows-latest）**跑不了全量 339 项**：
#   * 无内核时全量是 189 通过 / 150 失败（2026-10-01 实测，见
#     docs/OPENSOURCE-READINESS.md §4.2）；
#   * 也**不能**把内核上传到 CI —— 那等于在公开仓库的 CI 存储里再分发无许可的第三方代码
#     与 War Thunder 游戏数据，正是这个仓库要避免的事。
#   所以：托管 runner 上只跑**不碰内核的 50 项 + 包装校验**；全量自检留给
#   self-hosted runner（维护者本机），手动触发。
#
# 本地验证过（Windows / Python 3.14.7 / numpy 2.5.2 / matplotlib 3.11.1，2026-10-01）：
#   python tests\run_tests.py -k flightpath   → 通过 37 / 失败 0 / 共 37， 0.8 s
#   python tests\run_tests.py -k form_dirty   → 通过 12 / 失败 0 / 共 12， 0.0 s
#   python tests\run_tests.py -k printed_text → 通过  1 / 失败 0 / 共  1， 0.0 s
#   python -m compileall -q src tests         → exit 0
#   python -m pip wheel . --no-deps           → 见 §6.5 的实测记录
#   kernel-contract 段在内核**缺席**时的实测输出：
#     OK (kernel absent, clear error): vendor 求解器不在：<repo>/vendor/wt-missile/wt_missile.py
#                                      （见 vendor/wt-missile/VENDOR.md）
#
# 所有 step 都用 bash：ubuntu 与 windows-latest（Git for Windows 自带 bash）都能跑。
# 不要用 PowerShell 的 foreach —— 它在 ubuntu 上不存在。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) 无内核也能跑的：纯运动学 + 表单差异 + 文案扫描 + 包装元数据
  # ---------------------------------------------------------------------------
  shell:
    name: shell-only (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: src
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法编译检查（不 import、不需要内核）
        run: python -m compileall -q src tests

      - name: 包装元数据自洽（pyproject.toml 可解析、依赖可解析）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: 不碰内核的 50 项（37 + 12 + 1）
        run: |
          set -e
          for k in flightpath form_dirty printed_text; do
            echo "--- -k $k"
            python tests/run_tests.py -k "$k"
          done

      - name: 内核缺席时的报错必须是 SolverUnavailable（不能是 ImportError/AttributeError）
        # 这一步**两个分支都接受**：内核在场 → 打印身份；内核缺席 →
        # 必须是 SolverUnavailable，且文案里带 vendor/wt-missile/VENDOR.md 这条线索。
        run: |
          python - <<'PY'
          import missile_sim.solver as s
          try:
              ident = s.identity()
          except s.SolverUnavailable as e:
              print("OK (kernel absent, clear error):", e)
              assert "VENDOR.md" in str(e) or "vendor" in str(e)
              raise SystemExit(0)
          print("OK (kernel present):", ident.get("model"))
          PY

  # ---------------------------------------------------------------------------
  # 2) 全量自检：需要内核，只能在**自带内核的 self-hosted runner** 上跑。
  #    windows-latest 其实预装 VS 2022（有 MSVC），fast 档本来能编译 ——
  #    但托管 runner 拿不到内核，所以这条**必须**是 self-hosted。
  #    没注册对应 runner 时 job 会一直排队，故默认只允许手动触发。
  # ---------------------------------------------------------------------------
  full-suite:
    name: full-suite (self-hosted, needs kernel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows]
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: src
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: 确认内核在位（不在就明确失败，不要跑出一堆假红）
        run: |
          if (-not (Test-Path "vendor/wt-missile/wt_missile.py")) {
            throw "缺少 vendor/wt-missile/ 内核：见 vendor/README.md，本仓库不含它。"
          }

      - name: 全量自检（基线 339/0/339，约 4 分钟）
        run: python tests/run_tests.py

      - name: 出图冒烟：三格式 + 自报 backend
        run: |
          python -m missile_sim --no-iso --tag ci_probe
          python -c "import json;d=json.load(open('results/plane_ci_probe.json',encoding='utf-8'));print('backend =',d.get('backend'),'/',d.get('fallback_reason'))"
