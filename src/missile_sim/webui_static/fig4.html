<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图4 ΔV–BC–γ 交互式三维散点 + 等时面</title>
<link rel="stylesheet" href="/static/fig4.css">
</head>
<body>
<div id="wrap">
  <!-- 输入 / 工况区（task-20 要统一四页布局，所以这一块是独立容器、样式全在 fig4.css） -->
  <div id="bar" class="fig4-inputs">
    <div class="grp">
      <label for="missile">弹种</label>
      <select id="missile"></select>
    </div>
    <div class="grp wide">
      <label>工况</label>
      <span id="scene">—</span>
    </div>
    <div class="grp">
      <button id="btnLayer" type="button">生成等时面</button>
    </div>
    <div class="grp wide">
      <label for="layer">等时面 <b id="layerLabel">未生成</b></label>
      <input id="layer" type="range" min="0" max="0" step="1" value="0" disabled>
    </div>
    <div class="grp">
      <button id="btnReset" type="button">复位</button>
      <button id="btnSpin" type="button">自动旋转</button>
      <a id="btnOpen" href="/fig4" target="_blank" rel="noopener">在新标签页打开</a>
    </div>
    <div id="layernote" class="note wide"></div>
  </div>
  <!-- 主视图区 -->
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div id="layerbadge" class="off"></div>
    <div id="hud">
      <b id="title">图4 三维散点</b>
      <span id="sub">正在取数据…</span>
      <span id="stat"></span>
    </div>
  </div>
  <!-- 色标 / 图例区 -->
  <div id="side">
    <div class="cap">颜色刻度（11 枚弹共享范围）</div>
    <canvas id="cbar" width="190" height="250"></canvas>
  </div>
  <div id="legend"></div>
  <div id="err"></div>
</div>
<script src="/static/fig4.js"></script>
</body>
</html>
