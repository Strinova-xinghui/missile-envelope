<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图3 ΔV–BC–ginv 交互式三维散点 + 等时面</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/fig3.css">
</head>
<body>
<div class="shell" id="shell">
<button id="railtoggle" class="rail-toggle" type="button" aria-expanded="true"
        title="折叠控制栏">‹</button>
<aside class="rail" id="rail">
  <div class="rail-head"><b class="rail-title">图3 显示设置</b></div>
  <div class="rail-body">
    <section class="rail-sec">
      <h3>数据与等时面</h3>
      <!-- 输入 / 工况区。结构由 v4 定（`#bar` 的 `.grp` 是 fig3.js 的接线面），
           task-20 只把它从"图上方一横条"挪进左栏（见 fig3.css 末尾那一节）。 -->
      <div id="bar" class="fig3-inputs">
        <div class="grp">
          <label for="missile">弹种</label>
          <select id="missile"></select>
        </div>
        <div class="grp wide">
          <label>工况</label>
          <span id="scene">—</span>
        </div>
        <div class="grp">
          <button id="btnLayer" type="button">生成等时面</button>
        </div>
        <div class="grp wide">
          <label for="layer">等时面 <b id="layerLabel">未生成</b></label>
          <input id="layer" type="range" min="0" max="0" step="1" value="0" disabled>
        </div>
        <div class="grp">
          <button id="btnReset" type="button">复位</button>
          <button id="btnSpin" type="button">自动旋转</button>
          <a id="btnOpen" href="/fig3" target="_blank" rel="noopener">在新标签页打开</a>
        </div>
        <div id="layernote" class="note wide"></div>
      </div>
    </section>
  </div>
</aside>
<main class="mainview" id="main">
  <div id="wrap">
    <!-- 主视图区 -->
    <div id="view">
      <canvas id="cv"></canvas>
      <div id="labels"></div>
      <div id="layerbadge" class="off"></div>
      <div id="hud">
        <b id="title">图3 三维散点</b>
        <span id="sub">正在取数据…</span>
        <span id="stat"></span>
      </div>
    </div>
    <!-- 色标 / 图例区 -->
    <div id="side">
      <div class="cap">颜色刻度（11 枚弹共享范围）</div>
      <canvas id="cbar" width="190" height="250"></canvas>
    </div>
    <div id="legend"></div>
    <div id="err"></div>
  </div>
</main>
</div>
<script src="/static/app.js"></script>
<script src="/static/fig3.js"></script>
</body>
</html>
